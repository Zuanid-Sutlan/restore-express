name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fat JAR
        run: |
          chmod +x gradlew
          ./gradlew shadowJar

      - name: Prepare Deployment Files
        run: |
          mkdir -p deploy
          cp build/libs/*-all.jar deploy/app.jar
          cp docker-compose.yml deploy/docker-compose.yml

      - name: Transfer Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_SSH_PORT }}
          source: "deploy/*"
          strip_components: 1
          target: "~/restore-express"

      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_SSH_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/snap/bin
            source ~/.profile 2>/dev/null || true
            source ~/.bashrc 2>/dev/null || true
            cd ~/restore-express

            if command -v docker &> /dev/null; then
              DOCKER_CMD="docker"
            elif [ -f /usr/bin/docker ]; then
              DOCKER_CMD="/usr/bin/docker"
            elif [ -f /usr/local/bin/docker ]; then
              DOCKER_CMD="/usr/local/bin/docker"
            elif [ -f /snap/bin/docker ]; then
              DOCKER_CMD="/snap/bin/docker"
            else
              echo "Error: docker binary not found on remote server."
              exit 1
            fi

            if $DOCKER_CMD compose version &> /dev/null; then
              COMPOSE_CMD="$DOCKER_CMD compose"
            elif command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            else
              echo "Error: docker compose plugin or docker-compose binary not found."
              exit 1
            fi

            $COMPOSE_CMD down --remove-orphans
            $COMPOSE_CMD up -d --force-recreate
            $DOCKER_CMD image prune -f
