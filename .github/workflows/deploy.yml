name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fat JAR
        run: |
          chmod +x gradlew
          ./gradlew shadowJar

      - name: Prepare Deployment Files
        run: |
          mkdir -p deploy
          cp build/libs/*-all.jar deploy/app.jar
          cp docker-compose.yml deploy/docker-compose.yml

      - name: Transfer Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_SSH_PORT }}
          source: "deploy/*"
          strip_components: 1
          target: "~/restore-express"

      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_SSH_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/snap/bin:/usr/libexec/docker
            source ~/.profile 2>/dev/null || true
            source ~/.bashrc 2>/dev/null || true

            DOCKER_CMD=""
            for cmd in "docker" "/usr/bin/docker" "/usr/local/bin/docker" "/snap/bin/docker"; do
              if command -v $cmd &> /dev/null || [ -f $cmd ]; then
                DOCKER_CMD="$cmd"
                break
              fi
            done

            if [ -z "$DOCKER_CMD" ]; then
              echo "Docker not found on server. Installing Docker automatically..."
              if command -v curl &> /dev/null; then
                curl -fsSL https://get.docker.com | sh || sudo curl -fsSL https://get.docker.com | sh
              elif command -v wget &> /dev/null; then
                wget -qO- https://get.docker.com | sh || sudo wget -qO- https://get.docker.com | sh
              fi

              for cmd in "docker" "/usr/bin/docker" "/usr/local/bin/docker" "/snap/bin/docker"; do
                if command -v $cmd &> /dev/null || [ -f $cmd ]; then
                  DOCKER_CMD="$cmd"
                  break
                fi
              done
            fi

            if [ -z "$DOCKER_CMD" ]; then
              echo "Error: Unable to locate or install docker on the remote server."
              exit 1
            fi

            if ! $DOCKER_CMD info &> /dev/null; then
              if command -v sudo &> /dev/null && sudo $DOCKER_CMD info &> /dev/null; then
                DOCKER_CMD="sudo $DOCKER_CMD"
              fi
            fi

            COMPOSE_CMD=""
            if $DOCKER_CMD compose version &> /dev/null; then
              COMPOSE_CMD="$DOCKER_CMD compose"
            elif command -v docker-compose &> /dev/null; then
              COMPOSE_CMD="docker-compose"
            elif command -v sudo &> /dev/null && sudo docker-compose version &> /dev/null; then
              COMPOSE_CMD="sudo docker-compose"
            fi

            if [ -z "$COMPOSE_CMD" ]; then
              echo "Error: Docker Compose unavailable on server."
              exit 1
            fi

            cd ~/restore-express
            $COMPOSE_CMD down --remove-orphans || true
            $COMPOSE_CMD up -d --force-recreate

            echo "Waiting for PostgreSQL database to start..."
            for i in {1..30}; do
              if $COMPOSE_CMD exec -T db pg_isready -U postgres &> /dev/null; then
                break
              fi
              sleep 1
            done

            # Check if database authentication succeeds with password 'postgres'
            # If authentication fails due to stale volume created with old password, reset volume
            if ! $COMPOSE_CMD exec -T db psql -U postgres -d restore_express -c "\q" &> /dev/null; then
              echo "Database authentication failed (stale volume detected). Resetting database volume..."
              $COMPOSE_CMD down -v --remove-orphans || true
              $COMPOSE_CMD up -d --force-recreate
            fi

            $DOCKER_CMD image prune -f || true
